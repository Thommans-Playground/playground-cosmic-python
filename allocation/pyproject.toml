[project]
name = "allocation"
version = "0.1.0"
description = "Allocation service from Architecture Patterns with Python"
authors = [
    { name = "Sree R One", email = "sreeraj_ec@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "run>=0.3",
    "ty>=0.0.91",
    "uv>=0.13.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]